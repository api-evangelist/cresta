standards:
  - id: rfc9116-security-txt
    conforms: true
    evidence: >-
      https://cresta.com/.well-known/security.txt returns 200 with Contact,
      Expires, Encryption, Preferred-Languages, Canonical, Policy and Hiring
      fields.
  - id: grpc
    conforms: true
    evidence: >-
      api.cresta.com answers with the grpc-gateway transcoding error
      ("the requested gRPC method is either not registered, or registered with
      a different HTTP method"), so the platform API is gRPC with JSON
      transcoding in front of it.
  - id: google-rpc-status-error-model
    conforms: true
    evidence: >-
      Observed anonymous error body {"code":2,"httpStatus":500,"message":...,
      "status":"UNKNOWN"} — the google.rpc.Status / gRPC canonical-code model
      (code 2 = UNKNOWN), not RFC 9457.
  - id: rfc9457-problem-details
    conforms: false
    evidence: 'Error responses are application/json google.rpc.Status, not application/problem+json.'
  - id: hsts
    conforms: true
    evidence: 'api.cresta.com returns strict-transport-security: max-age=31536000; includeSubDomains.'
  - id: openapi
    conforms: false
    evidence: No OpenAPI or Swagger document is published on any Cresta host.
  - id: asyncapi
    conforms: false
    evidence: >-
      Cresta ingests audio over WebSocket, gRPC streaming, SIPREC and raw RTP,
      but publishes no AsyncAPI, channel catalog or message schemas.
  - id: oauth2
    conforms: unknown
    evidence: >-
