      OIDC/OAuth documents on trust.cresta.com belong to SafeBase, not Cresta.
  - id: mcp
    conforms: partial
    evidence: >-
      Cresta AI Agent is an MCP CLIENT — it consumes external tools over MCP and
      API function calling. Cresta publishes no MCP server of its own. See
      mcp/cresta-mcp.yml.
  - id: content-signals
    conforms: true
    evidence: >-
      docs.cresta.com/robots.txt carries "Content-Signal: ai-train=no,
      search=no, ai-input=no" — an explicit machine-readable AI-use preference.
