aid: cresta
name: Cresta
description: >-
  Cresta (legally Cresta Intelligence, Inc.) is a Palo Alto, California
  enterprise Customer Experience AI company spun out of the Stanford AI Lab
  and founded in 2017 by Zayd Enam, Tim Shi, and Sebastian Thrun, and led
  since 2023 by CEO Ping Wu, the former co-founder of Google Contact Center
  AI. The platform unifies human and AI agents for the enterprise contact
  center across voice, chat, email, and SMS, combining real-time agent
  assist, autonomous omnichannel AI agents, conversation intelligence, an
  AI analyst, a knowledge agent, coaching, a training simulator, and
  automated quality management, all orchestrated through Cresta Opera, a
  no-code AI orchestration layer, with Cresta Conductor as the developer
  facing agentic engine for building and optimizing AI agents. Cresta runs
  a multi-model architecture composed of 20+ large and small language
  models, fine-tuned on customer-specific transcripts and synthetic data,
  with enterprise guardrails, supervisory models, and automated pre-release
  AI agent testing. The AI Agent consumes external tools through API-based
  function calling and the Model Context Protocol; Cresta itself does not
  publish an MCP server. Voice integrations span Five9, Genesys (Cloud CX
  and Engage), NICE CXone, Amazon Connect, Twilio Flex, Talkdesk, 8x8,
  Vonage, Gladly, TCN, RingCX, Avaya Infinity, Cisco UCCE/PCCE/UCCX, and
  SIPREC across Oracle, Ribbon, Avaya SBC, and Cisco CUBE via SIP, PSTN
  transfer, CCaaS native streaming, WebSocket, gRPC, and raw RTP. Cresta is
  privately held at Series D with $280M+ raised from Greylock, Andreessen
  Horowitz, Sequoia, Tiger Global, Coatue, Greenoaks, Lightspeed, Porsche
  Ventures, World Innovation Lab, and the Qatar Investment Authority, plus
  strategic investors including Genesys, Five9, Accenture, Comcast,
  Qualcomm, JP Morgan, and Workday Ventures. It is the first Customer
  Experience AI provider to hold ISO/IEC 42001 certification, alongside
  SOC 2 Type II, ISO 27001, HIPAA, GDPR, TISAX, CCPA, and PCI DSS posture.
  A production API host is live at api.cresta.com — a gRPC-JSON transcoding
  gateway that answers anonymously with a google.rpc.Status error envelope —
  but the Cresta API and SDK are gated behind a customer / partner
  engagement: there is no public OpenAPI specification, no published API
  reference or base-path documentation, no public SDK release on any
  package registry, no public pricing, and no developer self-service signup.
