apis:
  - name: Cresta Platform API
    description: >-
      Cresta's production API host. https://api.cresta.com resolves and answers
      anonymously with a gRPC-JSON transcoding gateway error envelope
      ({"code":2,"httpStatus":500,"message":"the requested gRPC method is either
      not registered, or registered with a different HTTP method","status":
      "UNKNOWN"}), confirming a live grpc-gateway fronting Cresta's gRPC
      services. Cresta describes it publicly only as "SDKs and APIs to
      facilitate integrating with Cresta conversation services"; no reference,
      method list, base path, authentication scheme, or OpenAPI specification is
      published, and developers.cresta.com routes prospective integrators to a
      demo request. Recorded as a confirmed but gated surface — probed, never
      credentialed.
